name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  backend:
    name: backend / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: true
      matrix:
        include:
          - suite: static
            shard: 0
          - suite: regular-1
            shard: 1
          - suite: regular-2
            shard: 2
          - suite: regular-3
            shard: 3
          - suite: migrations
            shard: 0

    services:
      db:
        image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: map_db
          POSTGRES_USER: map_user
          POSTGRES_PASSWORD: map_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://map_user:map_password@localhost:5432/map_db
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-secret-key-for-testing-only
      FIELD_ENCRYPTION_KEY: Y2ktb25seS1mZXJuZXQta2V5LTMyLWJ5dGVzISEhISE=
      BACKUP_INTEGRATION_DATABASE_URL: postgres://map_user:map_password@localhost:5432/map_db

    steps:
      - name: Получить исходный код
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Настроить Python 3.12.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: |
            requirements/base.in
            requirements/ci-tools.in
            requirements/ci-tools.txt
            requirements/dev.in
            requirements/dev.txt
            requirements/prod.in
            requirements/prod.txt
            backup/requirements.in
            backup/requirements.txt

      - name: Установить проверенные CI-инструменты
        if: ${{ matrix.suite == 'static' }}
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          --requirement requirements/ci-tools.txt

      - name: Проверить воспроизводимость Python lock-файлов
        if: ${{ matrix.suite == 'static' }}
        run: |
          scripts/compile_requirements.sh
          lock_files=(
            requirements/prod.txt
            requirements/dev.txt
            requirements/ci-tools.txt
            backup/requirements.txt
          )
          git ls-files --error-unmatch "${lock_files[@]}" > /dev/null
          git diff --exit-code -- "${lock_files[@]}"

      - name: Установить проверенные dev-зависимости
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --requirement requirements/dev.txt
          python -m pip check

      - name: Проверить production Python-зависимости на уязвимости
        if: ${{ matrix.suite == 'static' }}
        run: |
          for lock_file in \
            requirements/prod.txt \
            requirements/dev.txt \
            requirements/ci-tools.txt \
            backup/requirements.txt
          do
            python -m pip_audit \
              --requirement "$lock_file" \
              --require-hashes \
              --disable-pip \
              --progress-spinner off \
              --strict
          done

      - name: Сформировать воспроизводимые Python SBOM
        if: ${{ matrix.suite == 'static' }}
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          cyclonedx-py requirements \
            --output-reproducible \
            --output-format JSON \
            --output-file "$RUNNER_TEMP/sbom/backend.cdx.json" \
            requirements/prod.txt
          cyclonedx-py requirements \
            --output-reproducible \
            --output-format JSON \
            --output-file "$RUNNER_TEMP/sbom/backup.cdx.json" \
            backup/requirements.txt

      - name: Установить PostgreSQL client и ShellCheck
        if: ${{ matrix.suite == 'static' }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client-16 shellcheck

      - name: Установить PostgreSQL client
        if: ${{ matrix.suite == 'migrations' }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client-16

      - name: Проверить линтером (flake8)
        if: ${{ matrix.suite == 'static' }}
        run: flake8 .

      - name: Проверить application-wide backend type baseline (mypy)
        if: ${{ matrix.suite == 'static' }}
        run: |
          mypy
          mypy --check-untyped-defs \
            --exclude '(^|/)(tests?|migrations)/' \
            apps config backup

      - name: Проверить shell-скрипты
        if: ${{ matrix.suite == 'static' }}
        run: >-
          shellcheck dev.sh deploy.sh scripts/backup.sh scripts/restore.sh
          scripts/compile_requirements.sh
          scripts/ci_production_runtime_smoke.sh
          scripts/check_backup_freshness.sh scripts/production_backup.sh
          scripts/production_backup_check.sh scripts/production_restore.sh
          scripts/reload_production_nginx.sh
          scripts/verify_production_topology.sh
          scripts/check_production_capacity.sh
          scripts/production_release.sh
          scripts/bootstrap_production_host_contract.sh
          scripts/production_deploy_gateway.sh
          scripts/install_production_host_services.sh
          scripts/validate_production_checkout.sh
          scripts/rotate_backup_db_password.sh

      - name: Проверить runtime-контракты без запуска сервисов
        if: ${{ matrix.suite == 'static' }}
        run: >-
          python -m pytest
          tests/test_runtime_contract.py
          tests/test_healthchecks.py
          tests/test_deploy_contract.py
          -q

      - name: Проверить незаписанные изменения моделей
        if: ${{ matrix.suite == 'static' }}
        run: python manage.py makemigrations --check --dry-run

      - name: Применить миграции для schema/OpenAPI gate
        if: ${{ matrix.suite == 'static' }}
        run: python manage.py migrate --noinput

      - name: Проверить OpenAPI-схему
        if: ${{ matrix.suite == 'static' }}
        run: python manage.py spectacular --file /tmp/openapi-schema.yml --validate --fail-on-warn

      - name: Запустить обычные тесты — shard ${{ matrix.shard }}/3
        if: ${{ startsWith(matrix.suite, 'regular-') }}
        env:
          COVERAGE_FILE: ${{ runner.temp }}/coverage/.coverage.${{ matrix.suite }}
        run: |
          mkdir -p "$RUNNER_TEMP/coverage"
          python -m pytest \
            --ignore-glob='**/test_*migration*.py' \
            --ignore=tests/test_backup_postgres_integration.py \
            --splits 3 \
            --group "${{ matrix.shard }}" \
            --splitting-algorithm least_duration \
            --durations-path .github/pytest-durations.json \
            --cov=apps \
            --cov-config=.coveragerc \
            --cov-report= \
            --cov-fail-under=0
          test -s "$COVERAGE_FILE"

      - name: Подготовить основную БД для migration/backup integration gate
        if: ${{ matrix.suite == 'migrations' }}
        run: python manage.py migrate --noinput

      - name: Запустить migration и backup integration тесты
        if: ${{ matrix.suite == 'migrations' }}
        env:
          COVERAGE_FILE: ${{ runner.temp }}/coverage/.coverage.migrations
        run: |
          mkdir -p "$RUNNER_TEMP/coverage"
          mapfile -t db_tests < <(
            find apps tests -type f \
              \( -name 'test_*migration*.py' \
                 -o -path 'tests/test_backup_postgres_integration.py' \) \
              -print | sort
          )
          test "${#db_tests[@]}" -gt 1
          printf 'DB-isolated tests:\n%s\n' "${db_tests[*]}"
          python -m pytest \
            "${db_tests[@]}" \
            --maxfail=1 \
            --cov=apps \
            --cov-config=.coveragerc \
            --cov-report= \
            --cov-fail-under=0
          test -s "$COVERAGE_FILE"

      - name: Сохранить данные покрытия shard-а
        if: ${{ startsWith(matrix.suite, 'regular-') || matrix.suite == 'migrations' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-${{ matrix.suite }}-${{ github.sha }}
          path: ${{ runner.temp }}/coverage/.coverage.${{ matrix.suite }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
          compression-level: 1
          overwrite: true

      - name: Сохранить Python SBOM артефакты
        if: ${{ matrix.suite == 'static' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sbom-python-${{ github.sha }}
          path: ${{ runner.temp }}/sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
          overwrite: true

  coverage:
    name: coverage
    needs: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Получить исходный код
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Настроить Python 3.12.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Установить проверенные dev-зависимости
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          --requirement requirements/dev.txt

      - name: Получить данные покрытия всех shard-ов
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: coverage-*-${{ github.sha }}
          path: ${{ runner.temp }}/coverage
          merge-multiple: true

      - name: Объединить покрытие и применить единый порог
        run: |
          python -m coverage combine --keep "$RUNNER_TEMP/coverage"
          python -m coverage report --fail-under=70
          python -m coverage xml -o coverage.xml

      - name: Загрузить покрытие
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          disable_search: true
          disable_telem: true
          version: v11.3.1

  runtime_images:
    name: production images / runtime / Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Получить исходный код
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Установить checksum-проверенный Trivy 0.72.0
        env:
          # Direct release assets are not updated by Dependabot: bump the
          # version, URL and official checksum together during runtime review.
          TRIVY_TARBALL_SHA256: bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea
        run: |
          trivy_tarball="$RUNNER_TEMP/trivy_0.72.0_Linux-64bit.tar.gz"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --retry 3 \
            --show-error \
            --silent \
            --tlsv1.2 \
            https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz \
            --output "$trivy_tarball"
          printf '%s  %s\n' "$TRIVY_TARBALL_SHA256" "$trivy_tarball" \
            | sha256sum -c -
          tar -xzf "$trivy_tarball" -C "$RUNNER_TEMP" trivy
          mv "$RUNNER_TEMP/trivy" "$RUNNER_TEMP/trivy-0.72.0"
          chmod 0755 "$RUNNER_TEMP/trivy-0.72.0"
          test "$("$RUNNER_TEMP/trivy-0.72.0" --version | head -n 1)" = \
            'Version: 0.72.0'

      - name: Сформировать ежедневный ключ базы Trivy
        id: trivy-cache-key
        run: echo "utc_day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Восстановить базу Trivy
        id: trivy-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache/db
          key: trivy-db-v0.72.0-${{ runner.os }}-${{ runner.arch }}-${{ steps.trivy-cache-key.outputs.utc_day }}
          restore-keys: |
            trivy-db-v0.72.0-${{ runner.os }}-${{ runner.arch }}-

      - name: Проверить Compose, runtime и production images
        env:
          COMPOSE_PROJECT_NAME: saas-poster-ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: map_db
          POSTGRES_USER: map_user
          POSTGRES_PASSWORD: map_password
          CACHE_REDIS_PASSWORD: cache-ci-password
          CELERY_REDIS_PASSWORD: broker-ci-password
          DEPLOY_GIT_SHA: ${{ github.sha }}
          RESTORE_SIGNING_PUBLIC_KEY: ci-public-key-placeholder
          RESTORE_S3_ACCESS_KEY: ci-read-access
          RESTORE_S3_SECRET_KEY: ci-read-secret
        run: |
          cleanup() {
            if [[ -f .restore.env ]]; then
              docker compose --env-file .restore.env \
                -f docker-compose.restore.yml down --remove-orphans \
                >/dev/null 2>&1 || true
            fi
            docker compose -f docker-compose.prod.yml down --remove-orphans \
              >/dev/null 2>&1 || true
            rm -f \
              .env .backup.env .restore.env \
              /tmp/backup-age-identity.txt
          }
          trap cleanup EXIT
          cp .env.example .env
          cp .backup.env.example .backup.env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml --profile ops config --quiet
          docker compose -f docker-compose.prod.yml --profile ops build \
            django celery_worker celery_beat celery_worker_images frontend backup \
            egress_proxy
          docker compose -f docker-compose.prod.yml pull \
            db redis redis_broker nginx
          scripts/ci_production_runtime_smoke.sh
          cp .restore.env.example .restore.env
          install -m 600 /dev/null /tmp/backup-age-identity.txt
          sed -i 's|^RESTORE_AGE_IDENTITY_HOST_FILE=.*|RESTORE_AGE_IDENTITY_HOST_FILE=/tmp/backup-age-identity.txt|' .restore.env
          docker compose --env-file .restore.env -f docker-compose.restore.yml config --quiet
          docker compose --env-file .restore.env -f docker-compose.restore.yml \
            build restore egress_proxy
          scan_services=(
            django
            celery_worker
            celery_beat
            celery_worker_images
            frontend
            backup
            db
            redis
            redis_broker
            egress_proxy
            nginx
          )
          image_list="$RUNNER_TEMP/production-images.txt"
          docker compose -f docker-compose.prod.yml --profile ops \
            config --images "${scan_services[@]}" > "$image_list"
          docker compose --env-file .restore.env -f docker-compose.restore.yml \
            config --images restore >> "$image_list"
          sort --unique "$image_list" --output "$image_list"
          mapfile -t image_refs < "$image_list"
          test "${#image_refs[@]}" -gt 0
          declare -A scanned_image_ids=()
          for image_ref in "${image_refs[@]}"
          do
            image_id="$(docker image inspect --format '{{.Id}}' "$image_ref")"
            test -n "$image_id"
            if [[ -n "${scanned_image_ids[$image_id]:-}" ]]; then
              continue
            fi
            scanned_image_ids["$image_id"]=1
            echo "==> Trivy: $image_ref ($image_id)"
            "$RUNNER_TEMP/trivy-0.72.0" image \
              --cache-dir "$RUNNER_TEMP/trivy-cache" \
              --disable-telemetry \
              --image-src docker \
              --scanners vuln \
              --pkg-types os,library \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --ignorefile .trivyignore.yaml \
              --exit-code 1 \
              --format table \
              --no-progress \
              --timeout 10m \
              "$image_id"
          done

      - name: Сохранить базу Trivy
        if: ${{ success() && github.event_name == 'push' && steps.trivy-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache/db
          key: ${{ steps.trivy-cache.outputs.cache-primary-key }}

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Получить исходный код
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Настроить Node.js 24.18.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Настроить npm 12.0.2
        env:
          NPM_TARBALL_SHA512: b885e890b9418fa1693544d05f53e64f9a73ec194837d4258b15fecdd692347b1dd2a517b1b0cbaf9d31cd8e92c3b70956bd2ecc72833a57b4b3098f5bfa7943
        run: |
          npm_tarball="$RUNNER_TEMP/npm-12.0.2.tgz"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --retry 3 \
            --show-error \
            --silent \
            --tlsv1.2 \
            https://registry.npmjs.org/npm/-/npm-12.0.2.tgz \
            --output "$npm_tarball"
          printf '%s  %s\n' "$NPM_TARBALL_SHA512" "$npm_tarball" \
            | sha512sum -c -
          npm install --global "$npm_tarball" \
            --ignore-scripts --no-audit --no-fund
          rm -f "$npm_tarball"
          test "$(npm --version)" = "12.0.2"

      - name: Установить frontend-зависимости
        working-directory: frontend
        run: npm ci --strict-allow-scripts

      - name: Проверить frontend-зависимости на уязвимости
        working-directory: frontend
        run: |
          npm audit --audit-level=moderate
          npm run audit:prod

      - name: Сформировать frontend SBOM
        working-directory: frontend
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          npm sbom \
            --omit=dev \
            --sbom-format=cyclonedx \
            --sbom-type=application \
            > "$RUNNER_TEMP/sbom/frontend.cdx.json"

      - name: Проверить и собрать frontend
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint
          npm run test:unit
          npm run build

      - name: Сохранить frontend SBOM артефакт
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sbom-frontend-${{ github.sha }}
          path: ${{ runner.temp }}/sbom/frontend.cdx.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
          overwrite: true

  test:
    name: test
    if: ${{ always() }}
    needs:
      - backend
      - coverage
      - runtime_images
      - frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Проверить все обязательные CI-gates
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          RUNTIME_IMAGES_RESULT: ${{ needs.runtime_images.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          results=(
            "backend=$BACKEND_RESULT"
            "coverage=$COVERAGE_RESULT"
            "runtime_images=$RUNTIME_IMAGES_RESULT"
            "frontend=$FRONTEND_RESULT"
          )
          printf '%s\n' "${results[@]}"
          for result in \
            "$BACKEND_RESULT" \
            "$COVERAGE_RESULT" \
            "$RUNTIME_IMAGES_RESULT" \
            "$FRONTEND_RESULT"
          do
            test "$result" = success
          done
