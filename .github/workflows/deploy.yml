name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  gate:
    name: Проверить режим завершённого CI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        vars.PROD_DEPLOY_ENABLED == 'true'
      }}
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Получить exact-run CI gate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: ci-gate-*
          path: ${{ runner.temp }}/ci-gate
          merge-multiple: true

      - name: Проверить режим CI без исполнения artifact content
        id: mode
        run: |
          mapfile -t evidence_files < <(
            find "$RUNNER_TEMP/ci-gate" -type f -name evidence.txt -print
          )
          test "${#evidence_files[@]}" -eq 1
          tree="$(sed -n 's/^tree=//p' "${evidence_files[0]}")"
          mode="$(sed -n 's/^mode=//p' "${evidence_files[0]}")"
          case "$tree" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#tree}" -eq 40
          case "$mode" in
            docs|full|reuse) ;;
            *) exit 1 ;;
          esac
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment:
      name: production
    # Автодеплой включается repo-переменной PROD_DEPLOY_ENABLED=true
    # и выполняется только после успешного CI для push в main. Защиту и
    # обязательных reviewers следует настроить для GitHub environment production.
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        needs.gate.result == 'success' &&
        needs.gate.outputs.mode != 'docs' &&
        vars.PROD_DEPLOY_ENABLED == 'true'
      }}

    steps:
      - name: Проверить deploy-настройки
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_HOST_FINGERPRINT: ${{ secrets.PROD_HOST_FINGERPRINT }}
        run: |
          test -n "$PROD_HOST"
          test -n "$PROD_USER"
          test -n "$PROD_SSH_KEY"
          test -n "$PROD_HOST_FINGERPRINT"
          case "$PROD_HOST" in
            ''|-*|*[!A-Za-z0-9._:-]*)
              echo "Некорректный PROD_HOST" >&2
              exit 1
              ;;
          esac
          case "$PROD_USER" in
            ''|-*|*[!A-Za-z0-9._-]*)
              echo "Некорректный PROD_USER" >&2
              exit 1
              ;;
          esac
          test "$PROD_USER" = mapdeploy
          case "$PROD_HOST_FINGERPRINT" in
            SHA256:?*) ;;
            *)
              echo "PROD_HOST_FINGERPRINT должен быть SHA256 fingerprint" >&2
              exit 1
              ;;
          esac
          fingerprint_value=${PROD_HOST_FINGERPRINT#SHA256:}
          case "$fingerprint_value" in
            *[!A-Za-z0-9+/=_-]*)
              echo "Некорректный PROD_HOST_FINGERPRINT" >&2
              exit 1
              ;;
          esac
          case "$DEPLOY_SHA" in
            ''|*[!0-9a-f]*) echo "Некорректный commit SHA" >&2; exit 1 ;;
          esac
          test "${#DEPLOY_SHA}" -eq 40

      - name: Деплой на продакшн-сервер
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_HOST_FINGERPRINT: ${{ secrets.PROD_HOST_FINGERPRINT }}
        run: |
          ssh_dir="$(mktemp -d "$RUNNER_TEMP/deploy-ssh.XXXXXX")"
          chmod 700 "$ssh_dir"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id"
          chmod 600 "$ssh_dir/id"

          ssh-keyscan -T 10 "$PROD_HOST" > "$ssh_dir/scanned-host-keys"
          fingerprint_matched=false
          while IFS= read -r host_key; do
            case "$host_key" in
              ''|'#'*) continue ;;
            esac
            printf '%s\n' "$host_key" > "$ssh_dir/candidate-host-key"
            key_info="$(
              ssh-keygen -lf "$ssh_dir/candidate-host-key" -E sha256
            )"
            candidate_fingerprint="${key_info#* }"
            candidate_fingerprint="${candidate_fingerprint%% *}"
            if [ "$candidate_fingerprint" = "$PROD_HOST_FINGERPRINT" ]; then
              printf '%s\n' "$host_key" > "$ssh_dir/known_hosts"
              fingerprint_matched=true
              break
            fi
          done < "$ssh_dir/scanned-host-keys"
          if [ "$fingerprint_matched" != true ]; then
            echo "SSH host fingerprint не совпадает" >&2
            exit 1
          fi

          timeout --foreground --signal=TERM --kill-after=30s 140m \
            ssh \
              -i "$ssh_dir/id" \
              -o BatchMode=yes \
              -o ClearAllForwardings=yes \
              -o ConnectTimeout=30 \
              -o GlobalKnownHostsFile=/dev/null \
              -o IdentitiesOnly=yes \
              -o KbdInteractiveAuthentication=no \
              -o LogLevel=ERROR \
              -o PasswordAuthentication=no \
              -o ServerAliveCountMax=3 \
              -o ServerAliveInterval=30 \
              -o StrictHostKeyChecking=yes \
              -o UpdateHostKeys=no \
              -o UserKnownHostsFile="$ssh_dir/known_hosts" \
              -o VerifyHostKeyDNS=no \
              "$PROD_USER@$PROD_HOST" \
              deploy "$DEPLOY_SHA"
