name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Автодеплой включается repo-переменной PROD_DEPLOY_ENABLED=true
    # (плюс секреты PROD_HOST/PROD_USER/PROD_SSH_KEY). Контекст secrets
    # в job-level if недопустим — из-за этого воркфлоу падал на каждом пуше.
    if: ${{ vars.PROD_DEPLOY_ENABLED == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Деплой на продакшн-сервер
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/saas_poster
            ./deploy.sh
