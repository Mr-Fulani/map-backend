name: Production monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      fault_mode:
        description: 'Test incident path without contacting production'
        required: true
        default: none
        type: choice
        options:
          - none
          - fail
          - timeout

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    # 17m check + 5m incident reconciliation + 3m runner reserve.
    timeout-minutes: 25
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_HOST_FINGERPRINT: ${{ secrets.PROD_HOST_FINGERPRINT }}
      PROD_READY_URL: https://dodugir.com/api/v1/ready/
      MONITOR_FAULT_MODE: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.fault_mode || 'none' }}
    steps:
      - name: Проверить public readiness, backup и topology
        id: production_check
        continue-on-error: true
        timeout-minutes: 17
        run: |
          case "${MONITOR_FAULT_MODE:-none}" in
            none) ;;
            fail) exit 97 ;;
            timeout)
              timeout --foreground --signal=TERM --kill-after=1s 1s sleep 5
              ;;
            *) exit 64 ;;
          esac

          test -n "$PROD_HOST"
          test -n "$PROD_USER"
          test "$PROD_USER" = mapdeploy
          test -n "$PROD_SSH_KEY"
          case "$PROD_HOST_FINGERPRINT" in SHA256:?*) ;; *) exit 1 ;; esac

          curl --fail --silent --show-error --max-time 20 \
            --output /dev/null "$PROD_READY_URL"

          ssh_dir="$(mktemp -d "$RUNNER_TEMP/monitor-ssh.XXXXXX")"
          chmod 700 "$ssh_dir"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id"
          chmod 600 "$ssh_dir/id"
          timeout --foreground --signal=TERM --kill-after=2s 15s \
            ssh-keyscan -T 10 "$PROD_HOST" > "$ssh_dir/scanned-host-keys"

          fingerprint_matched=false
          while IFS= read -r host_key; do
            case "$host_key" in ''|'#'*) continue ;; esac
            printf '%s\n' "$host_key" > "$ssh_dir/candidate-host-key"
            key_info="$(ssh-keygen -lf "$ssh_dir/candidate-host-key" -E sha256)"
            candidate_fingerprint="${key_info#* }"
            candidate_fingerprint="${candidate_fingerprint%% *}"
            if [ "$candidate_fingerprint" = "$PROD_HOST_FINGERPRINT" ]; then
              printf '%s\n' "$host_key" > "$ssh_dir/known_hosts"
              fingerprint_matched=true
              break
            fi
          done < "$ssh_dir/scanned-host-keys"
          [ "$fingerprint_matched" = true ]

          ssh_options=(
            -i "$ssh_dir/id"
            -o BatchMode=yes
            -o ClearAllForwardings=yes
            -o ConnectTimeout=30
            -o GlobalKnownHostsFile=/dev/null
            -o IdentitiesOnly=yes
            -o KbdInteractiveAuthentication=no
            -o LogLevel=ERROR
            -o PasswordAuthentication=no
            -o StrictHostKeyChecking=yes
            -o UpdateHostKeys=no
            -o UserKnownHostsFile="$ssh_dir/known_hosts"
            -o VerifyHostKeyDNS=no
          )
          # The outer client deadline must exceed the host unit's 10m deadline.
          timeout --foreground --signal=TERM --kill-after=10s 11m \
            ssh "${ssh_options[@]}" "$PROD_USER@$PROD_HOST" backup-check
          timeout --foreground --signal=TERM --kill-after=10s 2m \
            ssh "${ssh_options[@]}" "$PROD_USER@$PROD_HOST" topology-check
          timeout --foreground --signal=TERM --kill-after=10s 2m \
            ssh "${ssh_options[@]}" "$PROD_USER@$PROD_HOST" capacity-check

      - name: Открыть или обновить incident issue
        id: incident_open
        if: ${{ always() && !cancelled() && steps.production_check.outcome == 'failure' }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Production monitor failed'
          body="Automated production readiness, backup freshness, or topology check failed. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue_number="$(
            gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "in:title $title" --limit 100 --json number,title \
              --jq 'map(select(.title == "Production monitor failed")) | .[0].number // empty'
          )"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body "$body"
          fi
          exit 1

      - name: Закрыть восстановленный incident issue
        id: incident_close
        if: ${{ always() && !cancelled() && steps.production_check.outcome == 'success' }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Production monitor failed'
          issue_number="$(
            gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "in:title $title" --limit 100 --json number,title \
              --jq 'map(select(.title == "Production monitor failed")) | .[0].number // empty'
          )"
          if [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --comment 'Automated production checks have recovered.'
          fi
