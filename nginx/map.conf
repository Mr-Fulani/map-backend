# Rate limiting zones (per IP)
limit_req_zone $binary_remote_addr zone=api:10m       rate=60r/m;
limit_req_zone $binary_remote_addr zone=webhook:10m   rate=30r/m;
limit_req_zone $binary_remote_addr zone=admin:10m     rate=20r/m;
limit_req_zone $binary_remote_addr zone=checkout:10m  rate=10r/m;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=addr:10m;

upstream django {
    server django:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Redirect all HTTP to HTTPS in production
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options            "DENY"               always;
    add_header X-Content-Type-Options     "nosniff"            always;
    add_header X-XSS-Protection           "1; mode=block"      always;
    add_header Referrer-Policy            "strict-origin"      always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;

    client_max_body_size 10m;
    limit_conn addr 20;

    # YooKassa webhook — отдельный лимит, не мешает обычному API
    location /api/v1/billing/webhook/ {
        limit_req zone=webhook burst=10 nodelay;
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Checkout — защита от автоматизированных платежей
    location /api/v1/billing/checkout/ {
        limit_req zone=checkout burst=3 nodelay;
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Основной API
    location /api/v1/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Django Admin — только с доверенных IP в продакшне
    location /admin/ {
        limit_req zone=admin burst=5 nodelay;
        # allow 10.0.0.0/8;      # VPN / офисная сеть
        # deny  all;
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Swagger / Schema (отключить в проде при необходимости)
    location /api/ {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
