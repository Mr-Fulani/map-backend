x-egress-environment: &egress-environment
  HTTP_PROXY: http://egress_proxy:3128
  HTTPS_PROXY: http://egress_proxy:3128
  http_proxy: http://egress_proxy:3128
  https_proxy: http://egress_proxy:3128
  NO_PROXY: localhost,127.0.0.1,db,redis,django,frontend,nginx,egress_proxy
  no_proxy: localhost,127.0.0.1,db,redis,django,frontend,nginx,egress_proxy

services:
  django:
    build:
      context: .
      args:
        REQUIREMENTS: requirements/prod.txt
    command: gunicorn config.wsgi:application -w 4 -b 0.0.0.0:8000 --timeout 120
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      <<: *egress-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      egress_proxy:
        condition: service_started
    networks: [backend]
    volumes:
      - static_volume:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery_worker:
    build:
      context: .
      args:
        REQUIREMENTS: requirements/prod.txt
    command: celery -A config worker -Q sync_import,avito_publish,avito_update,avito_price,avito_delete,ai_generate,notifications,billing,part_parsing,part_parsing_bulk --concurrency=4 -l warning
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      <<: *egress-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      egress_proxy:
        condition: service_started
    networks: [backend]
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery_beat:
    build:
      context: .
      args:
        REQUIREMENTS: requirements/prod.txt
    command: celery -A config beat -S django_celery_beat.schedulers:DatabaseScheduler -l warning
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      <<: *egress-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      egress_proxy:
        condition: service_started
    networks: [backend]

  celery_worker_images:
    build:
      context: .
      args:
        REQUIREMENTS: requirements/prod.txt
    command: celery -A config worker -Q image_search,image_search_bulk,media_processing --concurrency=2 -n worker-images@%h -l warning
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      <<: *egress-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      egress_proxy:
        condition: service_started
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d worker-images@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ""
    environment:
      NEXT_PUBLIC_API_URL: ""
    depends_on:
      django:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --maxmemory 512mb --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  egress_proxy:
    image: ubuntu/squid:6.6-24.04_edge
    volumes:
      - ./egress-proxy.conf:/etc/squid/squid.conf:ro
    networks:
      - backend
      - egress_public
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      django:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [backend]

volumes:
  postgres_data:
  static_volume:

networks:
  backend:
    internal: true
  egress_public:
