x-egress-environment: &egress-environment
  HTTP_PROXY: http://egress_proxy:3128
  HTTPS_PROXY: http://egress_proxy:3128
  http_proxy: http://egress_proxy:3128
  https_proxy: http://egress_proxy:3128
  EMAIL_HTTP_PROXY_URL: http://egress_proxy:3128
  PUBLIC_HTTP_PROXY_URL: http://egress_proxy:3128
  NO_PROXY: localhost,127.0.0.1,db,redis,redis_broker,django,frontend,nginx,egress_proxy
  no_proxy: localhost,127.0.0.1,db,redis,redis_broker,django,frontend,nginx,egress_proxy
  HOME: /tmp
  XDG_CACHE_HOME: /tmp/.cache

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-runtime-policy: &runtime-policy
  restart: unless-stopped
  logging: *default-logging
  security_opt:
    - no-new-privileges:true

x-unprivileged-runtime: &unprivileged-runtime
  read_only: true
  cap_drop:
    - ALL

services:
  django:
    <<: [*runtime-policy, *unprivileged-runtime]
    init: true
    user: "1000:1000"
    build:
      context: .
      args:
        REQUIREMENTS: requirements/prod.txt
    command: gunicorn config.wsgi:application -w 2 -b 0.0.0.0:8000 --timeout 120
    cpus: "1.0"
    mem_limit: 320m
    pids_limit: 256
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      <<: *egress-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
      egress_proxy:
        condition: service_healthy
    networks: [backend]
    volumes:
      - static_volume:/app/staticfiles
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-m", "apps.core.healthchecks", "django-liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    stop_grace_period: 45s

  celery_worker:
    <<: [*runtime-policy, *unprivileged-runtime]
    init: true
    user: "1000:1000"
    build:
      context: .
      args:
        REQUIREMENTS: requirements/prod.txt
    # One prefork child leaves headroom for private-feed SDK initialization
    # inside this fixed 448 MiB cgroup budget. Production recorded repeated
    # memory.max pressure while two children were resident.
    command: celery -A config worker -Q sync_import,avito_publish,avito_update,avito_price,avito_delete,ai_generate,notifications,billing,part_parsing,part_parsing_bulk --concurrency=1 -n worker-main@%h -l warning
    cpus: "1.5"
    mem_limit: 448m
    pids_limit: 256
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      <<: *egress-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
      egress_proxy:
        condition: service_healthy
    networks: [backend]
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d worker-main@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 150s

  celery_beat:
    <<: [*runtime-policy, *unprivileged-runtime]
    init: true
    user: "1000:1000"
    build:
      context: .
      args:
        REQUIREMENTS: requirements/prod.txt
    command: celery -A config beat -S apps.core.celery_beat:HeartbeatDatabaseScheduler --pidfile=/tmp/celerybeat.pid -l warning
    cpus: "0.5"
    mem_limit: 96m
    pids_limit: 128
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      CELERY_BEAT_HEARTBEAT_FILE: /tmp/celerybeat-heartbeat
      CELERY_BEAT_HEARTBEAT_MAX_AGE_SECONDS: "120"
      <<: *egress-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
      egress_proxy:
        condition: service_healthy
    networks: [backend]
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-m", "apps.core.healthchecks", "celery-beat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    stop_grace_period: 45s

  celery_worker_images:
    <<: [*runtime-policy, *unprivileged-runtime]
    init: true
    user: "1000:1000"
    build:
      context: .
      args:
        REQUIREMENTS: requirements/prod.txt
    command: celery -A config worker -Q image_search,image_search_bulk,media_processing --concurrency=1 -n worker-images@%h -l warning
    cpus: "1.5"
    mem_limit: 448m
    pids_limit: 192
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      <<: *egress-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
      egress_proxy:
        condition: service_healthy
    networks: [backend]
    tmpfs:
      - /tmp:size=512m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d worker-images@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 150s

  frontend:
    <<: [*runtime-policy, *unprivileged-runtime]
    init: true
    user: "1000:1000"
    cpus: "0.75"
    mem_limit: 192m
    pids_limit: 128
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ""
    environment:
      NEXT_PUBLIC_API_URL: ""
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
    depends_on:
      django:
        condition: service_healthy
    networks: [backend]
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,uid=1000,gid=1000,mode=0750
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 45s

  db:
    <<: *runtime-policy
    build:
      context: .
      dockerfile: ops/postgres/Dockerfile
    cpus: "1.5"
    mem_limit: 512m
    pids_limit: 256
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    stop_grace_period: 60s

  redis:
    <<: *runtime-policy
    image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 128
    command: ["sh", "-c", "exec redis-server --requirepass \"$$CACHE_REDIS_PASSWORD\" --maxmemory 160mb --maxmemory-policy allkeys-lru"]
    environment:
      CACHE_REDIS_PASSWORD: ${CACHE_REDIS_PASSWORD:?CACHE_REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$CACHE_REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    stop_grace_period: 30s

  redis_broker:
    <<: *runtime-policy
    image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    cpus: "0.75"
    mem_limit: 352m
    pids_limit: 128
    command: ["sh", "-c", "exec redis-server --requirepass \"$$CELERY_REDIS_PASSWORD\" --appendonly yes --appendfsync everysec --maxmemory 224mb --maxmemory-policy noeviction"]
    environment:
      CELERY_REDIS_PASSWORD: ${CELERY_REDIS_PASSWORD:?CELERY_REDIS_PASSWORD is required}
    volumes:
      - redis_broker_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$CELERY_REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [backend]
    stop_grace_period: 60s

  backup:
    <<: *unprivileged-runtime
    profiles: [ops]
    init: true
    restart: "no"
    user: postgres
    cpus: "1.5"
    mem_limit: 384m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    build:
      context: .
      dockerfile: backup/Dockerfile
    env_file:
      - .backup.env
    environment:
      DEPLOY_GIT_SHA: ${DEPLOY_GIT_SHA:-unknown}
      BACKUP_STATE_DIR: /state
      <<: *egress-environment
    depends_on:
      db:
        condition: service_healthy
      egress_proxy:
        condition: service_healthy
    networks: [backend]
    volumes:
      - backup_state:/state
      - /tmp
    stop_grace_period: 5m

  egress_proxy:
    <<: *runtime-policy
    build:
      context: .
      dockerfile: egress-proxy/Dockerfile
    cpus: "0.5"
    mem_limit: 96m
    pids_limit: 128
    volumes:
      - ./egress-proxy.conf:/etc/squid/squid.conf:ro
    networks:
      - backend
      - egress_public
    healthcheck:
      test: ["CMD", "/bin/bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/3128"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s

  nginx:
    <<: *runtime-policy
    build:
      context: .
      dockerfile: ops/nginx/Dockerfile
    cpus: "0.5"
    mem_limit: 96m
    pids_limit: 128
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - /etc/letsencrypt/live/dodugir.com:/etc/letsencrypt/live/dodugir.com:ro
      - /etc/letsencrypt/archive/dodugir.com:/etc/letsencrypt/archive/dodugir.com:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      django:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - backend
      - ingress_public
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s

volumes:
  postgres_data:
  redis_broker_data:
  backup_state:
  static_volume:

networks:
  backend:
    internal: true
  egress_public:
  ingress_public:
