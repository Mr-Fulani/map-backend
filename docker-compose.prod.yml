x-egress-environment: &egress-environment
  HTTP_PROXY: http://egress_proxy:3128
  HTTPS_PROXY: http://egress_proxy:3128
  http_proxy: http://egress_proxy:3128
  https_proxy: http://egress_proxy:3128
  NO_PROXY: localhost,127.0.0.1,db,redis,redis_broker,django,frontend,nginx,egress_proxy
  no_proxy: localhost,127.0.0.1,db,redis,redis_broker,django,frontend,nginx,egress_proxy

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-runtime-policy: &runtime-policy
  restart: unless-stopped
  logging: *default-logging

services:
  django:
    <<: *runtime-policy
    init: true
    build:
      context: .
      args:
        REQUIREMENTS: requirements/prod.txt
    command: gunicorn config.wsgi:application -w 4 -b 0.0.0.0:8000 --timeout 120
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      <<: *egress-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
      egress_proxy:
        condition: service_started
    networks: [backend]
    volumes:
      - static_volume:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/live/', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    stop_grace_period: 45s

  celery_worker:
    <<: *runtime-policy
    init: true
    build:
      context: .
      args:
        REQUIREMENTS: requirements/prod.txt
    command: celery -A config worker -Q sync_import,avito_publish,avito_update,avito_price,avito_delete,ai_generate,notifications,billing,part_parsing,part_parsing_bulk --concurrency=4 -n worker-main@%h -l warning
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      <<: *egress-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
      egress_proxy:
        condition: service_started
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d worker-main@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 150s

  celery_beat:
    <<: *runtime-policy
    init: true
    build:
      context: .
      args:
        REQUIREMENTS: requirements/prod.txt
    command: celery -A config beat -S apps.core.celery_beat:HeartbeatDatabaseScheduler --pidfile=/tmp/celerybeat.pid -l warning
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      CELERY_BEAT_HEARTBEAT_FILE: /tmp/celerybeat-heartbeat
      CELERY_BEAT_HEARTBEAT_MAX_AGE_SECONDS: "120"
      <<: *egress-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
      egress_proxy:
        condition: service_started
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-m", "apps.core.healthchecks", "celery-beat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    stop_grace_period: 45s

  celery_worker_images:
    <<: *runtime-policy
    init: true
    build:
      context: .
      args:
        REQUIREMENTS: requirements/prod.txt
    command: celery -A config worker -Q image_search,image_search_bulk,media_processing --concurrency=2 -n worker-images@%h -l warning
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      <<: *egress-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
      egress_proxy:
        condition: service_started
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d worker-images@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 150s

  frontend:
    <<: *runtime-policy
    init: true
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ""
    environment:
      NEXT_PUBLIC_API_URL: ""
    depends_on:
      django:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 45s

  db:
    <<: *runtime-policy
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    stop_grace_period: 60s

  redis:
    <<: *runtime-policy
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$CACHE_REDIS_PASSWORD\" --maxmemory 512mb --maxmemory-policy allkeys-lru"]
    environment:
      CACHE_REDIS_PASSWORD: ${CACHE_REDIS_PASSWORD:?CACHE_REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$CACHE_REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    stop_grace_period: 30s

  redis_broker:
    <<: *runtime-policy
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$CELERY_REDIS_PASSWORD\" --appendonly yes --appendfsync everysec --maxmemory 1gb --maxmemory-policy noeviction"]
    environment:
      CELERY_REDIS_PASSWORD: ${CELERY_REDIS_PASSWORD:?CELERY_REDIS_PASSWORD is required}
    volumes:
      - redis_broker_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$CELERY_REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [backend]
    stop_grace_period: 60s

  backup:
    profiles: [ops]
    init: true
    restart: "no"
    logging: *default-logging
    build:
      context: .
      dockerfile: backup/Dockerfile
    env_file:
      - .backup.env
    environment:
      DEPLOY_GIT_SHA: ${DEPLOY_GIT_SHA:-unknown}
      BACKUP_STATE_DIR: /state
      <<: *egress-environment
    depends_on:
      db:
        condition: service_healthy
      egress_proxy:
        condition: service_started
    networks: [backend]
    volumes:
      - backup_state:/state
    stop_grace_period: 5m

  egress_proxy:
    <<: *runtime-policy
    image: ubuntu/squid:6.6-24.04_edge
    volumes:
      - ./egress-proxy.conf:/etc/squid/squid.conf:ro
    networks:
      - backend
      - egress_public
    stop_grace_period: 30s

  nginx:
    <<: *runtime-policy
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      django:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s

volumes:
  postgres_data:
  redis_broker_data:
  backup_state:
  static_volume:

networks:
  backend:
    internal: true
  egress_public:
