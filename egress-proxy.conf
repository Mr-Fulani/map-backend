http_port 3128
httpd_suppress_version_string on
strip_query_terms on

acl SSL_ports port 443 587
acl Safe_ports port 80 443 587
acl CONNECT method CONNECT
acl smtp_submission_port port 587
acl platform_smtp dstdomain smtp.resend.com

# RFC 6890 / private / loopback / link-local / documentation / multicast ranges.
acl blocked_destinations dst 0.0.0.0/8
acl blocked_destinations dst 10.0.0.0/8
acl blocked_destinations dst 100.64.0.0/10
acl blocked_destinations dst 127.0.0.0/8
acl blocked_destinations dst 169.254.0.0/16
acl blocked_destinations dst 172.16.0.0/12
acl blocked_destinations dst 192.0.0.0/24
acl blocked_destinations dst 192.0.2.0/24
acl blocked_destinations dst 192.168.0.0/16
acl blocked_destinations dst 198.18.0.0/15
acl blocked_destinations dst 198.51.100.0/24
acl blocked_destinations dst 203.0.113.0/24
acl blocked_destinations dst 224.0.0.0/4
acl blocked_destinations dst 240.0.0.0/4
acl blocked_destinations dst ::1/128
acl blocked_destinations dst ::/128
# IPv4-compatible and other deprecated low-address forms; this does not cover
# the separate ::ffff:0:0/96 IPv4-mapped range Squid uses for public IPv4.
acl blocked_destinations dst ::/96
# Do not deny ::ffff:0:0/96: Squid uses that representation for all IPv4
# destinations, including public ones already filtered by the IPv4 ACLs above.
acl blocked_destinations dst 64:ff9b::/96
acl blocked_destinations dst 64:ff9b:1::/48
acl blocked_destinations dst 100::/64
# Fail-closed IPv6 special/reserved space. This is intentionally an independent
# superset of the application literal-IP admission. Do not add ::ffff:0:0/96:
# Squid uses that form internally for public IPv4 destinations.
acl blocked_destinations dst 100::/8
acl blocked_destinations dst 200::/7
acl blocked_destinations dst 400::/6
acl blocked_destinations dst 800::/5
acl blocked_destinations dst 1000::/4
acl blocked_destinations dst fc00::/7
acl blocked_destinations dst fe80::/10
acl blocked_destinations dst fec0::/10
acl blocked_destinations dst 2001::/23
acl blocked_destinations dst 2001::/32
acl blocked_destinations dst 2001:db8::/32
acl blocked_destinations dst 2002::/16
acl blocked_destinations dst 3fff::/20
acl blocked_destinations dst 4000::/3
acl blocked_destinations dst 6000::/3
acl blocked_destinations dst 8000::/3
acl blocked_destinations dst a000::/3
acl blocked_destinations dst c000::/3
acl blocked_destinations dst e000::/4
acl blocked_destinations dst f000::/5
acl blocked_destinations dst f800::/6
acl blocked_destinations dst fe00::/9
acl blocked_destinations dst ff00::/8
acl blocked_names dstdomain localhost .local .internal .home.arpa .test .invalid .example

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny smtp_submission_port !CONNECT
http_access deny smtp_submission_port !platform_smtp
http_access deny manager
http_access deny blocked_names
http_access deny blocked_destinations
http_access allow all

cache deny all
logformat safe_access %ts.%03tu %>a %tr %Ss/%>Hs %rm %>rd:%>rP %<st
access_log /var/log/squid/access.log safe_access
cache_log /var/log/squid/cache.log
logfile_rotate 0
via off
forwarded_for delete
