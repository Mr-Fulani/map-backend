server_tokens off;
client_header_timeout 15s;
client_body_timeout 60s;
send_timeout 60s;
keepalive_requests 1000;
reset_timedout_connection on;
proxy_hide_header X-Powered-By;

# Query strings and Referer values can carry reset tokens or provider secrets.
log_format main_sanitized '$remote_addr [$time_local] '
                          '"$request_method $uri $server_protocol" $status '
                          '$body_bytes_sent request_time=$request_time';
access_log /var/log/nginx/access.log main_sanitized;

limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=telegram_webhook:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=admin:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=checkout:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=marketplace_feed:10m rate=300r/m;
limit_conn_zone $binary_remote_addr zone=per_client:10m;

limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name dodugir.com www.dodugir.com 65.109.130.138;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        return 301 https://dodugir.com$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    server_name dodugir.com www.dodugir.com;
    http2 on;

    ssl_certificate /etc/letsencrypt/live/dodugir.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dodugir.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 12M;
    limit_conn per_client 20;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Stable marketplace feed capabilities live only in the query string.
    # The access format omits args and this location suppresses nginx error
    # lines, which can otherwise include the complete request URI on an
    # upstream failure. Application telemetry is deliberately identifier-free.
    location = /marketplace-feeds/v1/feed.xml {
        client_max_body_size 1K;
        limit_req zone=marketplace_feed burst=100 nodelay;
        error_log /dev/null crit;
        set $django http://django:8000;
        proxy_pass $django;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 10s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    # Reject lookalike capability paths at the edge. The exact location above
    # wins nginx precedence, while no query string reaches access/error logs.
    location ^~ /marketplace-feeds/ {
        access_log off;
        error_log /dev/null crit;
        return 404;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, immutable";
    }

    location = /api/v1/notifications/webhook/telegram/ {
        client_max_body_size 1M;
        limit_req zone=telegram_webhook burst=100 nodelay;
        set $django http://django:8000;
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ^~ /api/v1/auth/ {
        client_max_body_size 32K;
        limit_req zone=auth burst=10 nodelay;
        set $django http://django:8000;
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ^~ /api/v1/billing/webhook/ {
        client_max_body_size 256K;
        limit_req zone=webhook burst=10 nodelay;
        set $django http://django:8000;
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /api/v1/billing/checkout/ {
        client_max_body_size 64K;
        limit_req zone=checkout burst=3 nodelay;
        set $django http://django:8000;
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /api/v1/billing/ai-topup/ {
        client_max_body_size 64K;
        limit_req zone=checkout burst=3 nodelay;
        set $django http://django:8000;
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        client_max_body_size 12M;
        limit_req zone=api burst=20 nodelay;
        set $django http://django:8000;
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        limit_req zone=admin burst=5 nodelay;
        set $django http://django:8000;
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
