[mypy]
# Application-wide baseline. Third-party/Django imports are intentionally not
# followed until typed stubs/plugins are adopted, but every first-party Python
# module is parsed and checked; errors are never hidden with ignore_errors.
python_version = 3.12
incremental = False
plugins = mypy_django_plugin.main
files =
    apps,
    config,
    backup
# django-stubs 5.2.x can hit a mypy final-iteration assertion with `skip`.
# `silent` still analyzes imported types while suppressing diagnostics outside
# the first-party files listed above.
follow_imports = silent
ignore_missing_imports = True
show_error_codes = True
warn_unused_configs = True

[mypy.plugins.django-stubs]
django_settings_module = "config.settings.development"
strict_settings = false
