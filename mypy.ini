[mypy]
# Incremental baseline: these modules are already type-clean. Expand this list
# deliberately as Django model typing is brought under control; do not hide the
# existing application-wide debt with global ignore_errors.
python_version = 3.12
files =
    config/redis_config.py,
    config/sentry_scrubbing.py,
    apps/core/http_deadlines.py,
    apps/core/email_backend.py,
    apps/core/url_security.py,
    apps/core/management/commands/check_email_connectivity.py,
    apps/core/management/commands/check_public_http_connectivity.py,
    apps/core/management/commands/check_redis_connectivity.py,
    apps/anti_ban/shadow_ban.py,
    apps/marketplaces/adapters/avito/adapter.py,
    apps/products/storage.py,
    backup/common.py,
    backup/create.py,
    backup/check_freshness.py,
    backup/restore.py
follow_imports = skip
ignore_missing_imports = True
show_error_codes = True
warn_unused_configs = True
