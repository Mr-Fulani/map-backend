<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Laptop base -->
  <rect x="80" y="185" width="240" height="14" rx="5" fill="white" opacity="0.25"/>
  <!-- Laptop screen outer -->
  <rect x="100" y="90" width="200" height="135" rx="8" fill="white" opacity="0.2"/>
  <!-- Screen inner -->
  <rect x="112" y="100" width="176" height="112" rx="4" fill="#0f172a" opacity="0.5"/>
  <!-- Screen content lines (UI mockup) -->
  <rect x="124" y="112" width="80" height="6" rx="3" fill="white" opacity="0.2"/>
  <rect x="124" y="124" width="120" height="4" rx="2" fill="white" opacity="0.12"/>
  <rect x="124" y="134" width="100" height="4" rx="2" fill="white" opacity="0.12"/>
  <rect x="124" y="150" width="152" height="40" rx="4" fill="white" opacity="0.06"/>
  <rect x="130" y="156" width="60" height="6" rx="3" fill="white" opacity="0.15"/>
  <rect x="130" y="168" width="90" height="4" rx="2" fill="white" opacity="0.1"/>
  <!-- Webcam dot -->
  <circle cx="200" cy="97" r="3" fill="white" opacity="0.3"/>
  <!-- Hinge -->
  <rect x="100" y="195" width="200" height="4" rx="2" fill="white" opacity="0.15"/>
  <!-- Touchpad -->
  <rect x="172" y="202" width="56" height="34" rx="5" fill="white" opacity="0.12"/>
</svg>
