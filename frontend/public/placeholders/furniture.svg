<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Sofa base -->
  <rect x="70" y="185" width="260" height="55" rx="12" fill="white" opacity="0.22"/>
  <!-- Sofa back -->
  <rect x="70" y="130" width="260" height="65" rx="12" fill="white" opacity="0.18"/>
  <!-- Left armrest -->
  <rect x="65" y="148" width="30" height="92" rx="10" fill="white" opacity="0.22"/>
  <!-- Right armrest -->
  <rect x="305" y="148" width="30" height="92" rx="10" fill="white" opacity="0.22"/>
  <!-- Cushion divider -->
  <line x1="200" y1="185" x2="200" y2="240" stroke="#1c1917" stroke-width="3" opacity="0.3"/>
  <!-- Cushion top line -->
  <line x1="70" y1="185" x2="330" y2="185" stroke="#1c1917" stroke-width="2" opacity="0.2"/>
  <!-- Legs -->
  <rect x="95" y="238" width="14" height="28" rx="4" fill="white" opacity="0.2"/>
  <rect x="291" y="238" width="14" height="28" rx="4" fill="white" opacity="0.2"/>
  <!-- Cushion buttons -->
  <circle cx="145" cy="212" r="4" fill="white" opacity="0.15"/>
  <circle cx="255" cy="212" r="4" fill="white" opacity="0.15"/>
</svg>
